name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  shell-lint:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning \
            install.sh \
            src/cli/*.sh \
            scripts/*.sh \
            src/infra/mongo-init/*.sh \
            tests/integration/*.sh \
            demo/*.sh

  integration:
    name: Cluster integration
    runs-on: ubuntu-latest
    # Same values docker-compose.yml falls back to when there is no .env.
    # Real deployments get random credentials from install.sh.
    env:
      MONGO_ROOT_USERNAME: codeguard_root
      MONGO_ROOT_PASSWORD: changeme_root
      HAPROXY_STATS_PASSWORD: changeme
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the cluster
        # Not `--wait`: it races against the one-shot init containers, which
        # exit by design and can be removed while compose is still inspecting.
        #
        # Readiness is a functional check, not a count of healthy services: a
        # 200 from HAProxy already means the backend, ZooKeeper and the whole
        # sharded Mongo chain came up. Counting services broke the moment the
        # default replica count changed.
        run: |
          docker compose up -d --build
          for _ in $(seq 1 90); do
            if curl -sf -o /dev/null --max-time 5 http://127.0.0.1:80/health; then
              echo "cluster ready"
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          echo "cluster did not become ready"
          docker compose ps -a
          docker compose logs --tail 50
          exit 1

      - name: Cluster topology is what we claim it is
        run: |
          set -e
          echo "--- ZooKeeper quorum ---"
          for z in zoo1 zoo2 zoo3; do
            docker exec $z zkServer.sh status 2>&1 | grep -E 'Mode: (leader|follower)'
          done
          echo "--- MongoDB rejects unauthenticated access ---"
          docker exec mongos mongosh --quiet --eval \
            'db.getSiblingDB("codeguard").vulnerability_cache.countDocuments({})' 2>&1 \
            | grep -q 'requires authentication'
          echo "unauthenticated access denied"

          echo "--- collection is actually sharded ---"
          docker exec mongos mongosh --quiet \
            -u "$MONGO_ROOT_USERNAME" -p "$MONGO_ROOT_PASSWORD" \
            --authenticationDatabase admin --eval '
            const c = db.getSiblingDB("config").collections.findOne(
              {_id: "codeguard.vulnerability_cache"});
            if (!c || c.dropped) { print("NOT SHARDED"); quit(1); }
            print("shard key: " + JSON.stringify(c.key));'

      - name: Scan smoke test
        run: |
          set -e
          # A known-vulnerable version must report findings...
          test "$(curl -s -X POST http://127.0.0.1:80/scan \
            -H 'Content-Type: application/json' \
            -d '{"dependencies":["flask==2.2.2"]}' | jq '.vulnerable')" -gt 0
          # ...and a patched one must come back clean.
          test "$(curl -s -X POST http://127.0.0.1:80/scan \
            -H 'Content-Type: application/json' \
            -d '{"dependencies":["flask==3.1.3"]}' | jq '.vulnerable')" -eq 0
          # A malformed request must not be reported as clean.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:80/scan \
            -H 'Content-Type: application/json' -d '{"nope":1}')" = "400"

      - name: Scaling test
        run: |
          set -e
          up() { curl -s -u "admin:$HAPROXY_STATS_PASSWORD" 'http://127.0.0.1:8404/;csv' \
                 | awk -F, '$1=="flaskservers" && $2!="BACKEND" && $18=="UP"{n++} END{print n+0}'; }
          docker compose up -d --no-deps --no-recreate --scale backend=6 backend
          for _ in $(seq 1 30); do [ "$(up)" -ge 6 ] && break; sleep 2; done
          test "$(up)" -ge 6
          echo "HAProxy discovered 6 replicas without a restart"

      - name: Failover test
        run: ./tests/integration/failover_test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 100

  version-sync:
    name: Sync version badge
    needs: [unit-tests, shell-lint, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read CODEGUARD_VERSION
        id: ver
        run: |
          ver=$(grep -oP 'CODEGUARD_VERSION="\K[^"]+' src/cli/codeguard.sh)
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Update README badge
        run: |
          if grep -q 'img.shields.io/badge/version-' README.md; then
            sed -i "s|img.shields.io/badge/version-[^-]*-|img.shields.io/badge/version-${{ steps.ver.outputs.version }}-|g" README.md
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync version badge to ${{ steps.ver.outputs.version }}"
            git push
          fi
