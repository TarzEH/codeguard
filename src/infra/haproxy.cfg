global
  log stdout format raw local0 info

defaults
  mode http
  log global
  option httplog
  option redispatch
  retries 2
  timeout client 65s
  timeout connect 5s
  # An OSV call plus retries can legitimately take tens of seconds; the old
  # 10s server timeout turned slow-but-valid scans into 504s.
  timeout server 65s
  timeout http-request 15s

# Docker's embedded DNS. Asking it for "backend" returns one A record per
# running replica, which is how scaling is discovered without a config change.
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s
  hold other 5s
  hold refused 5s
  hold nx 5s
  hold timeout 5s

frontend stats
  bind *:8404
  stats enable
  stats uri /
  stats refresh 5s
  # The double quotes are load-bearing: unquoted, HAProxy does NOT expand the
  # variable and silently uses the literal "${HAPROXY_STATS_PASSWORD}" string
  # as the password.
  stats auth "admin:${HAPROXY_STATS_PASSWORD}"

frontend codeguard
  bind *:80
  # Without a default_backend only POST was routed; every other request,
  # health probes included, fell through to a 503.
  default_backend flaskservers

backend flaskservers
  balance roundrobin
  # Active health checks. Without them round-robin keeps feeding a dead
  # backend, so one request in four fails.
  option httpchk
  http-check send meth GET uri /health
  http-check expect status 200
  # 20 pre-allocated slots filled from DNS. Scaling the backend service from 4
  # to 12 replicas needs no HAProxy change and no restart - new containers are
  # picked up within the 5s DNS hold, and removed ones fail their check and
  # drop out. init-addr none lets HAProxy start before any replica exists.
  server-template srv 1-20 backend:5000 check resolvers docker init-addr none inter 3s fall 3 rise 2
